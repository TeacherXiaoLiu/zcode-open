<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ZCode Pet Bubble</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #card {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(28, 28, 32, 0.92);
        color: #f5f5f7;
        font:
          13px/1.35 system-ui,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      #list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 2px 4px;
        margin: -2px -4px;
        border-radius: 6px;
        cursor: pointer;
      }
      .row:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: #8b8b93;
        flex: none;
      }
      /* 状态灯：运行中蓝、已完成绿、中断/失败红、等待灰。 */
      .row[data-state="running"] .dot {
        background: #4c8dff;
      }
      .row[data-state="completed"] .dot {
        background: #3fb950;
      }
      .row[data-state="interrupted"] .dot,
      .row[data-state="failed"] .dot {
        background: #ff5d5d;
      }
      .body {
        min-width: 0;
        flex: 1;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .title {
        min-width: 0;
        flex: 1;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status {
        flex: none;
        font-size: 11px;
        opacity: 0.6;
      }
      .detail {
        margin-top: 2px;
        font-size: 12px;
        opacity: 0.75;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* 关闭按钮：唯一的移除路径；常态弱化，悬停行时提亮，避免视觉噪音。 */
      .close {
        flex: none;
        align-self: center;
        box-sizing: border-box;
        width: 18px;
        height: 18px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font-size: 14px;
        line-height: 1;
        opacity: 0.3;
        cursor: pointer;
      }
      .row:hover .close {
        opacity: 0.6;
      }
      .close:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.16);
      }
      @media (prefers-color-scheme: light) {
        #card {
          border-color: rgba(0, 0, 0, 0.08);
          background: rgba(255, 255, 255, 0.95);
          color: #1c1c1f;
          box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        }
        .row:hover {
          background: rgba(0, 0, 0, 0.06);
        }
        .close:hover {
          background: rgba(0, 0, 0, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="card"><ul id="list"></ul></div>
    <script type="module" src="./bubble.ts"></script>
  </body>
</html>
